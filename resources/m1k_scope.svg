<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4250"/>
      <stop offset="1" stop-color="#1c2129"/>
    </linearGradient>
    <radialGradient id="screen" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#0d1a12"/>
      <stop offset="1" stop-color="#030604"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Instrument body -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#body)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="43.5" fill="none"
        stroke="#5a6475" stroke-opacity="0.6"/>

  <!-- Screen -->
  <rect x="32" y="32" width="192" height="192" rx="18" fill="url(#screen)"
        stroke="#0a0d10" stroke-width="3"/>

  <!-- Graticule -->
  <g stroke="#2c4434" stroke-width="1.5" stroke-dasharray="3 5">
    <line x1="80" y1="40" x2="80" y2="216"/>
    <line x1="176" y1="40" x2="176" y2="216"/>
    <line x1="40" y1="80" x2="216" y2="80"/>
    <line x1="40" y1="176" x2="216" y2="176"/>
  </g>
  <g stroke="#3d5c46" stroke-width="2">
    <line x1="128" y1="40" x2="128" y2="216"/>
    <line x1="40" y1="128" x2="216" y2="128"/>
  </g>

  <!-- Square wave (cyan) -->
  <path d="M40 168 H72 V136 H112 V168 H152 V136 H192 V168 H216"
        fill="none" stroke="#00c8ff" stroke-width="7" stroke-linejoin="round"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- Sine wave (yellow) -->
  <path d="M40 104 C56 56, 72 56, 88 104 S120 152, 136 104 S168 56, 184 104 S208 136, 216 120"
        fill="none" stroke="#ffd700" stroke-width="8" stroke-linecap="round"
        filter="url(#glow)"/>
</svg>
